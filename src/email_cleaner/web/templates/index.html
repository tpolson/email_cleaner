<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Cleaner - Junk Detection Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        danger: '#EF4444',
                        success: '#10B981',
                        warning: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3B82F6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .email-row:hover {
            background-color: #f8fafc;
        }
        .confidence-high { background-color: #FEE2E2; color: #991B1B; }
        .confidence-medium { background-color: #FEF3C7; color: #92400E; }
        .confidence-low { background-color: #D1FAE5; color: #065F46; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="text-4xl">&#128465;</span>
                Email Cleaner
            </h1>
            <p class="text-gray-600 mt-2">Identify and clean junk emails from your inbox</p>
        </header>

        <!-- Connection Panel -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Email Connection</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">IMAP Server</label>
                    <input type="text" id="imap_server" value="imap.gmail.com"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
                    <input type="number" id="imap_port" value="993"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email_address" placeholder="you@example.com"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password / App Password</label>
                    <input type="password" id="email_password" placeholder="Your app password"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>
            <div class="mt-4 flex items-center gap-4">
                <button onclick="testConnection()" id="connectBtn"
                    class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 transition flex items-center gap-2">
                    <span id="connectLoader" class="loader hidden"></span>
                    Test Connection
                </button>
                <span id="connectionStatus" class="text-sm"></span>
            </div>
            <p class="text-xs text-gray-500 mt-3">
                For Gmail, use an <a href="https://support.google.com/accounts/answer/185833" target="_blank" class="text-primary hover:underline">App Password</a>
            </p>
        </div>

        <!-- Scan Panel -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Scan Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Folder</label>
                    <select id="folder" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="INBOX">INBOX</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Max Emails</label>
                    <input type="number" id="limit" value="50" min="1" max="500"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confidence Threshold</label>
                    <select id="threshold" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="0.5">50% (More aggressive)</option>
                        <option value="0.6">60%</option>
                        <option value="0.7" selected>70% (Balanced)</option>
                        <option value="0.8">80%</option>
                        <option value="0.9">90% (Conservative)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search Filter</label>
                    <select id="search" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="ALL">All Emails</option>
                        <option value="UNSEEN">Unread Only</option>
                        <option value="SEEN">Read Only</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button onclick="scanEmails()" id="scanBtn"
                    class="px-6 py-2 bg-success text-white rounded-md hover:bg-green-600 transition flex items-center gap-2">
                    <span id="scanLoader" class="loader hidden"></span>
                    <span id="scanBtnText">Scan Emails</span>
                </button>
            </div>
        </div>

        <!-- Results Panel -->
        <div id="resultsPanel" class="hidden">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow-md p-4">
                    <div class="text-3xl font-bold text-gray-800" id="statTotal">0</div>
                    <div class="text-sm text-gray-600">Emails Scanned</div>
                </div>
                <div class="bg-white rounded-lg shadow-md p-4">
                    <div class="text-3xl font-bold text-danger" id="statJunk">0</div>
                    <div class="text-sm text-gray-600">Junk Found</div>
                </div>
                <div class="bg-white rounded-lg shadow-md p-4">
                    <div class="text-3xl font-bold text-success" id="statClean">0</div>
                    <div class="text-sm text-gray-600">Clean Emails</div>
                </div>
                <div class="bg-white rounded-lg shadow-md p-4">
                    <div class="text-3xl font-bold text-primary" id="statSelected">0</div>
                    <div class="text-sm text-gray-600">Selected</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="bg-white rounded-lg shadow-md p-4 mb-6 flex flex-wrap items-center gap-4">
                <button onclick="selectAllJunk()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">
                    Select All Junk
                </button>
                <button onclick="selectNone()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition">
                    Clear Selection
                </button>
                <div class="flex-grow"></div>
                <button onclick="deleteSelected(true)" id="previewBtn"
                    class="px-4 py-2 bg-warning text-white rounded-md hover:bg-yellow-600 transition flex items-center gap-2">
                    <span id="previewLoader" class="loader hidden"></span>
                    Preview Delete
                </button>
                <button onclick="deleteSelected(false)" id="deleteBtn"
                    class="px-4 py-2 bg-danger text-white rounded-md hover:bg-red-600 transition flex items-center gap-2">
                    <span id="deleteLoader" class="loader hidden"></span>
                    Delete Selected
                </button>
            </div>

            <!-- Email List -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                </th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">From</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Confidence</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Indicators</th>
                            </tr>
                        </thead>
                        <tbody id="emailList" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="hidden fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg max-w-md"></div>
    </div>

    <script>
        let scanId = null;
        let emails = [];

        function getCredentials() {
            return {
                imap_server: document.getElementById('imap_server').value,
                imap_port: document.getElementById('imap_port').value,
                email_address: document.getElementById('email_address').value,
                email_password: document.getElementById('email_password').value,
            };
        }

        function showStatus(message, type = 'info') {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = 'fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg max-w-md';
            if (type === 'success') el.classList.add('bg-green-500', 'text-white');
            else if (type === 'error') el.classList.add('bg-red-500', 'text-white');
            else el.classList.add('bg-blue-500', 'text-white');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function setLoading(buttonId, loaderId, loading) {
            const btn = document.getElementById(buttonId);
            const loader = document.getElementById(loaderId);
            if (loading) {
                btn.disabled = true;
                btn.classList.add('opacity-75');
                loader.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                loader.classList.add('hidden');
            }
        }

        async function testConnection() {
            setLoading('connectBtn', 'connectLoader', true);
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = 'Connecting...';
            statusEl.className = 'text-sm text-blue-600';

            try {
                const response = await fetch('/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(getCredentials())
                });
                const data = await response.json();

                if (data.success) {
                    statusEl.textContent = 'Connected!';
                    statusEl.className = 'text-sm text-green-600';
                    // Update folder list
                    const folderSelect = document.getElementById('folder');
                    folderSelect.innerHTML = data.folders.map(f =>
                        `<option value="${f}">${f}</option>`
                    ).join('');
                    showStatus('Connected successfully!', 'success');
                } else {
                    statusEl.textContent = 'Connection failed';
                    statusEl.className = 'text-sm text-red-600';
                    showStatus(data.message, 'error');
                }
            } catch (e) {
                statusEl.textContent = 'Connection error';
                statusEl.className = 'text-sm text-red-600';
                showStatus('Network error: ' + e.message, 'error');
            }
            setLoading('connectBtn', 'connectLoader', false);
        }

        async function scanEmails() {
            setLoading('scanBtn', 'scanLoader', true);
            document.getElementById('scanBtnText').textContent = 'Scanning...';

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ...getCredentials(),
                        folder: document.getElementById('folder').value,
                        limit: document.getElementById('limit').value,
                        threshold: document.getElementById('threshold').value,
                        search: document.getElementById('search').value,
                    })
                });
                const data = await response.json();

                if (data.success) {
                    scanId = data.scan_id;
                    emails = data.emails;
                    renderResults(data);
                    showStatus(`Scanned ${data.total_scanned} emails, found ${data.junk_found} junk`, 'success');
                } else {
                    showStatus(data.message, 'error');
                }
            } catch (e) {
                showStatus('Scan error: ' + e.message, 'error');
            }

            setLoading('scanBtn', 'scanLoader', false);
            document.getElementById('scanBtnText').textContent = 'Scan Emails';
        }

        function renderResults(data) {
            document.getElementById('resultsPanel').classList.remove('hidden');
            document.getElementById('statTotal').textContent = data.total_scanned;
            document.getElementById('statJunk').textContent = data.junk_found;
            document.getElementById('statClean').textContent = data.total_scanned - data.junk_found;
            updateSelectedCount();

            const tbody = document.getElementById('emailList');
            tbody.innerHTML = emails.map(email => {
                const confidenceClass = email.confidence >= 0.9 ? 'confidence-high' :
                    email.confidence >= 0.7 ? 'confidence-medium' : 'confidence-low';
                const statusBadge = email.is_junk ?
                    '<span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">JUNK</span>' :
                    '<span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">CLEAN</span>';
                const date = new Date(email.date).toLocaleDateString();

                return `
                    <tr class="email-row ${email.is_junk ? 'bg-red-50' : ''}">
                        <td class="px-4 py-3">
                            <input type="checkbox" class="email-checkbox" data-uid="${email.uid}"
                                ${email.is_junk ? 'data-junk="true"' : ''} onchange="updateSelectedCount()">
                        </td>
                        <td class="px-4 py-3">${statusBadge}</td>
                        <td class="px-4 py-3">
                            <div class="text-sm font-medium text-gray-900">${escapeHtml(email.sender_name || email.sender)}</div>
                            <div class="text-xs text-gray-500">${escapeHtml(email.sender)}</div>
                        </td>
                        <td class="px-4 py-3">
                            <div class="text-sm text-gray-900 max-w-xs truncate">${escapeHtml(email.subject)}</div>
                        </td>
                        <td class="px-4 py-3 text-sm text-gray-500">${date}</td>
                        <td class="px-4 py-3">
                            <span class="px-2 py-1 text-xs rounded ${confidenceClass}">${Math.round(email.confidence * 100)}%</span>
                        </td>
                        <td class="px-4 py-3">
                            <div class="text-xs text-gray-500 max-w-xs truncate">${email.indicators.slice(0, 2).join(', ')}</div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function getSelectedUids() {
            return Array.from(document.querySelectorAll('.email-checkbox:checked'))
                .map(cb => parseInt(cb.dataset.uid));
        }

        function updateSelectedCount() {
            const count = getSelectedUids().length;
            document.getElementById('statSelected').textContent = count;
        }

        function selectAllJunk() {
            document.querySelectorAll('.email-checkbox[data-junk="true"]').forEach(cb => cb.checked = true);
            updateSelectedCount();
        }

        function selectNone() {
            document.querySelectorAll('.email-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('selectAll').checked = false;
            updateSelectedCount();
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            document.querySelectorAll('.email-checkbox').forEach(cb => cb.checked = checked);
            updateSelectedCount();
        }

        async function deleteSelected(dryRun) {
            const uids = getSelectedUids();
            if (uids.length === 0) {
                showStatus('No emails selected', 'error');
                return;
            }

            const btnId = dryRun ? 'previewBtn' : 'deleteBtn';
            const loaderId = dryRun ? 'previewLoader' : 'deleteLoader';
            setLoading(btnId, loaderId, true);

            if (!dryRun && !confirm(`Are you sure you want to delete ${uids.length} emails? This cannot be undone.`)) {
                setLoading(btnId, loaderId, false);
                return;
            }

            try {
                const response = await fetch('/api/clean', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        scan_id: scanId,
                        dry_run: dryRun,
                        email_uids: uids,
                    })
                });
                const data = await response.json();

                if (data.success) {
                    if (dryRun) {
                        showStatus(`Preview: Would delete ${data.deleted} emails, move ${data.moved_to_spam} to spam`, 'info');
                    } else {
                        showStatus(`Deleted ${data.deleted} emails, moved ${data.moved_to_spam} to spam`, 'success');
                        // Remove deleted emails from the list
                        emails = emails.filter(e => !uids.includes(e.uid));
                        renderResults({
                            total_scanned: emails.length,
                            junk_found: emails.filter(e => e.is_junk).length,
                            emails: emails
                        });
                    }
                } else {
                    showStatus(data.message, 'error');
                }
            } catch (e) {
                showStatus('Error: ' + e.message, 'error');
            }

            setLoading(btnId, loaderId, false);
        }
    </script>
</body>
</html>
